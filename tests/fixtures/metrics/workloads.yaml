apiVersion: v1
kind: Namespace
metadata:
  name: kubesift-metrics-check
  labels:
    kubesift.dev/fixture: phase1e3
---
apiVersion: v1
kind: Pod
metadata:
  name: current-usage
  namespace: kubesift-metrics-check
spec:
  containers:
    - name: primary
      image: registry.k8s.io/pause:3.10
      resources:
        requests: {cpu: 1m, memory: 1Mi}
        limits: {cpu: 10m, memory: 8Mi}
    - name: secondary
      image: registry.k8s.io/pause:3.10
      resources:
        requests: {cpu: 1m, memory: 1Mi}
        limits: {cpu: 10m, memory: 8Mi}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: core-reader
  namespace: kubesift-metrics-check
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: core-reader
  namespace: kubesift-metrics-check
rules:
  - apiGroups: [""]
    resources: [pods, namespaces, events]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: core-reader
  namespace: kubesift-metrics-check
subjects:
  - kind: ServiceAccount
    name: core-reader
    namespace: kubesift-metrics-check
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: core-reader
