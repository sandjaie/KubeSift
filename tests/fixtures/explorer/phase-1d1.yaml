apiVersion: v1
kind: Namespace
metadata:
  name: kubesift-scaling-check
  labels:
    kubesift.dev/fixture: phase1d1-validation
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reviewed-deployment
  namespace: kubesift-scaling-check
spec:
  replicas: 1
  selector:
    matchLabels: {app: reviewed-deployment}
  template:
    metadata:
      labels: {app: reviewed-deployment}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
---
apiVersion: v1
kind: Service
metadata:
  name: reviewed-statefulset
  namespace: kubesift-scaling-check
spec:
  clusterIP: None
  selector: {app: reviewed-statefulset}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: reviewed-statefulset
  namespace: kubesift-scaling-check
spec:
  replicas: 1
  serviceName: reviewed-statefulset
  selector:
    matchLabels: {app: reviewed-statefulset}
  template:
    metadata:
      labels: {app: reviewed-statefulset}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: scale-reader
  namespace: kubesift-scaling-check
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "deployments/scale", "statefulsets/scale"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: scale-reader
  namespace: kubesift-scaling-check
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: scale-reader
subjects:
  - kind: User
    name: kubesift-phase1d1-reader
    apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: scale-writer
  namespace: kubesift-scaling-check
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale", "statefulsets/scale"]
    resourceNames: ["reviewed-deployment", "reviewed-statefulset"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: scale-writer
  namespace: kubesift-scaling-check
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: scale-writer
subjects:
  - kind: User
    name: kubesift-phase1d1-writer
    apiGroup: rbac.authorization.k8s.io
