apiVersion: v1
kind: Pod
metadata:
  name: interactive-one
  labels:
    app: kubesift-interactive
spec:
  automountServiceAccountToken: false
  terminationGracePeriodSeconds: 1
  containers:
    - name: web
      image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
      command: ["/bin/sh", "-ec"]
      args:
        - mkdir -p /tmp/kubesift && printf 'kubesift-%s\n' "$HOSTNAME" > /tmp/kubesift/index.html &&
          exec httpd -f -p 8080 -h /tmp/kubesift
      ports:
        - name: web
          containerPort: 8080
          protocol: TCP
    - name: shell
      image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
      command: ["/bin/sleep", "3600"]
---
apiVersion: v1
kind: Pod
metadata:
  name: interactive-two
  labels:
    app: kubesift-interactive
spec:
  automountServiceAccountToken: false
  terminationGracePeriodSeconds: 1
  containers:
    - name: web
      image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
      command: ["/bin/sh", "-ec"]
      args:
        - mkdir -p /tmp/kubesift && printf 'kubesift-%s\n' "$HOSTNAME" > /tmp/kubesift/index.html &&
          exec httpd -f -p 8081 -h /tmp/kubesift
      ports:
        - name: web
          containerPort: 8081
          protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: interactive-web
spec:
  selector:
    app: kubesift-interactive
  ports:
    - name: http
      port: 80
      targetPort: web
      protocol: TCP
