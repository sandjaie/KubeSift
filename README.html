<!doctype html><html lang="en"><meta charset="utf-8"><title>KubeSift module</title><h1>.</h1><p>Desktop entry point; build/ contains pinned Wails template assets. Run npm ci, wails3 generate bindings -ts -i, npm run build, scripts/check.sh, wails3 build and wails3 package. Open bin/kubesift.app from Finder and confirm ready. No Kubernetes access occurs on startup.</p></html>
