name: Checks
on:
  push:
    branches: [develop, main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select checks
        id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          # Unknown bases and non-documentation paths always get the full gate.
          full=true
          if git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            full=false
            while IFS= read -r -d '' path; do
              case "$path" in
                docs/*|AGENTS.md|README.md|README.html) ;;
                *) full=true; break ;;
              esac
            done < <(git diff --name-only -z "$BASE" HEAD)
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
      - name: Check documentation and source descriptions
        if: steps.changes.outputs.full == 'false'
        run: |
          python3 scripts/source-descriptions.py check
          python3 scripts/check-docs.py
      - uses: actions/setup-go@v5
        if: steps.changes.outputs.full == 'true'
        with:
          go-version: '1.27.3'
          cache: true
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.full == 'true'
        with:
          node-version: '26.13.0'
          cache: npm
      - name: Cache Wails CLI
        if: steps.changes.outputs.full == 'true'
        id: wails
        uses: actions/cache@v4
        with:
          path: ~/go/bin/wails3
          key: wails-${{ runner.os }}-${{ runner.arch }}-go1.27.3-v3.1.0
      - run: npm ci
        if: steps.changes.outputs.full == 'true'
      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0
        if: steps.changes.outputs.full == 'true' && steps.wails.outputs.cache-hit != 'true'
      - run: wails3 task bindings
        if: steps.changes.outputs.full == 'true'
      - run: npm run build
        if: steps.changes.outputs.full == 'true'
      - run: scripts/check.sh
        if: steps.changes.outputs.full == 'true'
