name: Checks
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: startsWith(github.head_ref, 'release/') || startsWith(github.head_ref, 'hotfix/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select checks
        id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          # Unknown bases and non-documentation paths always get the full gate.
          full=true
          if git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            full=false
            while IFS= read -r -d '' path; do
              case "$path" in
                docs/*|AGENTS.md|README.md|README.html) ;;
                *) full=true; break ;;
              esac
            done < <(git diff --name-only -z "$BASE" HEAD)
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
      - name: Check documentation and source descriptions
        if: steps.changes.outputs.full == 'false'
        run: |
          python3 scripts/source-descriptions.py check
          python3 scripts/check-docs.py
      - uses: actions/setup-go@v5
        if: steps.changes.outputs.full == 'true'
        with:
          go-version: '1.27.3'
          cache: true
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.full == 'true'
        with:
          node-version: '26.13.0'
          cache: npm
      - run: npm ci
        if: steps.changes.outputs.full == 'true'
      # scripts/check.sh typechecks. This only fills the dist directory the Go embed requires.
      - name: Build frontend assets
        if: steps.changes.outputs.full == 'true'
        run: npm exec --workspace frontend -- vite build --mode production
      # ponytail: Linux purego compile, not a macOS package. Bindings stay on the local and release checks.
      - name: Run checks
        if: steps.changes.outputs.full == 'true'
        env:
          CGO_ENABLED: "0"
          GOFLAGS: -tags=purego
        run: scripts/check.sh
